name: drill

# Two independent jobs live in this workflow:
#
# 1. `test` -- runs on every push and pull request. Lints and runs the
#    fully-mocked unit test suite. No Kubernetes cluster is contacted;
#    the kubernetes client is mocked out entirely in tests/, so this job
#    needs no cluster credentials and is safe to run in a fork or PR.
#
# 2. `real-drill` -- only runs on a manual dispatch or the weekly
#    schedule, and only outside of a pull_request event. It executes the
#    actual drill against a real cluster reached via a KUBECONFIG
#    repository secret. This job intentionally will NOT run against a
#    fork's pull request: forks don't have access to this repo's
#    secrets, and GitHub Actions never exposes secrets to pull_request
#    workflows triggered from a fork, so the step would fail closed even
#    if someone tried to trigger it that way.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment name (must match a kube_context configured as a secret)"
        required: false
        default: "staging"
  schedule:
    # Weekly, Monday 06:00 UTC. Adjust to your organization's drill cadence.
    - cron: "0 6 * * 1"

jobs:
  test:
    name: lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check drill tests

      - name: Format check (black)
        run: black --check drill tests

      - name: Run unit tests
        run: pytest -v

  real-drill:
    name: run drill against target cluster
    runs-on: ubuntu-latest
    needs: test
    # Never run in a pull_request context (no secrets available there, and
    # we never want an untrusted PR branch to be able to trigger a real
    # failover simulation against a live cluster). Only manual dispatch or
    # the schedule trigger reach this job.
    if: github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: pip install -e .

      # This step requires two repository (or environment) secrets to be
      # configured by a maintainer before it will do anything useful:
      #   - KUBECONFIG_CONTENTS: a full kubeconfig with credentials scoped
      #     to the namespace this drill is allowed to touch.
      #   - DRILL_OPERATOR: the identity to attribute the scheduled run to
      #     (a human triggers workflow_dispatch; the schedule trigger has
      #     no human operator, so this documents who is accountable for it).
      # Neither secret exists in this public portfolio repo -- this job
      # will fail at the "Write kubeconfig" step until they're added,
      # which is expected and intentional for a repo with no real cluster
      # attached.
      - name: Write kubeconfig from secret
        env:
          KUBECONFIG_CONTENTS: ${{ secrets.KUBECONFIG_CONTENTS }}
        run: |
          if [ -z "${KUBECONFIG_CONTENTS:-}" ]; then
            echo "::error::KUBECONFIG_CONTENTS secret is not configured for this repo/environment. See docs/drill-playbook.md."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/.kube"
          echo "$KUBECONFIG_CONTENTS" > "$RUNNER_TEMP/.kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/.kube/config" >> "$GITHUB_ENV"

      - name: Run DR drill
        env:
          DRILL_OPERATOR: ${{ secrets.DRILL_OPERATOR || 'scheduled-ci' }}
        run: |
          python -m drill.cli run \
            --config config/drill-config.yaml \
            --checks config/checks.yaml \
            --operator "$DRILL_OPERATOR"

      - name: Upload drill report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drill-report-${{ github.run_id }}
          path: reports/
          retention-days: 90
